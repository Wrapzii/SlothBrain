name: Full Pipeline CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-tests:
    name: Backend Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite with coverage
        shell: pwsh
        run: |
          pytest backend/tests -q --maxfail=1 --disable-warnings --cov=backend --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  capability-contracts:
    name: Capability Contracts (Commit Gate)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full capability pipeline contracts
        shell: pwsh
        run: |
          pytest backend/tests/test_capability_pipeline.py -q --maxfail=1

  real-windows-desktop-e2e:
    name: Real Windows Desktop E2E
    runs-on: [self-hosted, windows]
    timeout-minutes: 60
    if: vars.SLOTHBRAIN_ENABLE_REAL_DESKTOP_E2E == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run real desktop + vision e2e lane
        shell: pwsh
        env:
          SLOTHBRAIN_REAL_DESKTOP_TESTS: "1"
        run: |
          pytest backend/tests -q -k "vision or runtime or capability" --maxfail=1
