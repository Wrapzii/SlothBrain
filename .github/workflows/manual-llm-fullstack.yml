name: Manual LLM Fullstack

on:
  workflow_dispatch:

jobs:
  manual-llm-fullstack:
    name: Manual LLM Fullstack (Self-Hosted Windows)
    runs-on: [self-hosted, windows]
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run manual full-stack LLM suite
        shell: pwsh
        env:
          SLOTHBRAIN_RUN_MANUAL_LLM_TESTS: "1"
        run: |
          pytest backend/tests/manual/test_manual_llm_fullstack.py -q -s
